version: '3.8'
services:
  synapse-postgresql:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=C --lc-ctype=C
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U synapse -d synapse
      interval: 10s
      timeout: 5s
      retries: 5
  synapse:
    image: matrixdotorg/synapse:latest
    restart: unless-stopped
    environment:
    - SYNAPSE_SERVER_NAME=${SYNAPSE_SERVER_NAME}
    - SYNAPSE_CONFIG_PATH=/data/homeserver.yaml
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - AUTHENTIK_CLIENT_SECRET=${AUTHENTIK_CLIENT_SECRET}
    - SYNAPSE_MACAROON_SECRET=${SYNAPSE_MACAROON_SECRET}
    - SYNAPSE_FORM_SECRET=${SYNAPSE_FORM_SECRET}
    - SYNAPSE_REGISTRATION_SECRET=${SYNAPSE_REGISTRATION_SECRET}
    - COTURN_SHARED_SECRET=${COTURN_SHARED_SECRET}
    volumes:
    - synapse_data:/data
    - ./devops/matrix-config/homeserver.yaml:/config/homeserver.yaml:ro
    entrypoint:
    - /bin/sh
    - -c
    - "# Inject secrets safely using Python\npython -c '\nimport os\nc = open(\"/config/homeserver.yaml\"\
      ).read()\nsecrets = [\"POSTGRES_PASSWORD\", \"AUTHENTIK_CLIENT_SECRET\", \"\
      SYNAPSE_MACAROON_SECRET\", \"SYNAPSE_FORM_SECRET\", \"SYNAPSE_REGISTRATION_SECRET\"\
      , \"COTURN_SHARED_SECRET\"]\nfor k in secrets:\n    c = c.replace(f\"$${{{k}}}\"\
      , os.environ.get(k, \"\"))\nopen(\"/data/homeserver.yaml\", \"w\").write(c)\n\
      '\npython -m synapse.app.homeserver --config-path /data/homeserver.yaml --keys-directory\
      \ /data --generate-keys\nchown -R 991:991 /data\nexec /start.py\n"
    depends_on:
      synapse-postgresql:
        condition: service_healthy
    networks:
    - default
    - dokploy-network
    labels:
    - traefik.enable=true
    - traefik.docker.network=dokploy-network
    - traefik.http.routers.synapse.rule=Host(`${SYNAPSE_SERVER_NAME}`)
    - traefik.http.routers.synapse.entrypoints=websecure
    - traefik.http.routers.synapse.tls=true
    - traefik.http.routers.synapse.tls.certresolver=letsencrypt
    - traefik.http.routers.synapse.middlewares=secure-headers
    - traefik.http.services.synapse.loadbalancer.server.port=8008
  element-web:
    image: vectorim/element-web:latest
    restart: unless-stopped
    volumes:
    - ./devops/element/config.json:/app/config.json:ro
    networks:
    - default
    - dokploy-network
    labels:
    - traefik.enable=true
    - traefik.docker.network=dokploy-network
    - traefik.http.routers.element.rule=Host(`chat.johnethel.school`)
    - traefik.http.routers.element.entrypoints=websecure
    - traefik.http.routers.element.tls=true
    - traefik.http.routers.element.tls.certresolver=letsencrypt
    - traefik.http.services.element.loadbalancer.server.port=80
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    command:
    - -n
    - --log-file=stdout
    - --min-port=49152
    - --max-port=49252
    - --use-auth-secret
    - --static-auth-secret=${COTURN_SHARED_SECRET}
    - --realm=${SYNAPSE_SERVER_NAME}
    - --no-tcp-relay
    environment:
    - COTURN_SHARED_SECRET=${COTURN_SHARED_SECRET}
    - SYNAPSE_SERVER_NAME=${SYNAPSE_SERVER_NAME}
  postgresql-authentik:
    image: postgres:16-alpine
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
    - authentik_database:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
      POSTGRES_USER: ${PG_USER:-authentik}
      POSTGRES_DB: ${PG_DB:-authentik}
    networks:
    - default
  redis-authentik:
    image: redis:alpine
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli ping | grep PONG
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    volumes:
    - authentik_redis:/data
    networks:
    - default
  authentik-server:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2024.8.2}
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_REDIS__HOST: redis-authentik
      AUTHENTIK_POSTGRESQL__HOST: postgresql-authentik
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
    volumes:
    - ./devops/authentik/media:/media
    - ./devops/authentik/custom-templates:/templates
    depends_on:
      postgresql-authentik:
        condition: service_healthy
      redis-authentik:
        condition: service_healthy
    networks:
    - default
    - dokploy-network
    labels:
    - traefik.enable=true
    - traefik.docker.network=dokploy-network
    - traefik.http.routers.authentik.rule=Host(`${AUTHENTIK_SERVER_NAME}`)
    - traefik.http.routers.authentik.entrypoints=websecure
    - traefik.http.routers.authentik.tls=true
    - traefik.http.routers.authentik.tls.certresolver=letsencrypt
    - traefik.http.services.authentik.loadbalancer.server.port=9000
  authentik-worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2024.8.2}
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_REDIS__HOST: redis-authentik
      AUTHENTIK_POSTGRESQL__HOST: postgresql-authentik
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
    user: root
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ./devops/authentik/media:/media
    - ./devops/authentik/certs:/certs
    - ./devops/authentik/custom-templates:/templates
    depends_on:
      postgresql-authentik:
        condition: service_healthy
      redis-authentik:
        condition: service_healthy
    networks:
    - default
  opencloud:
    image: opencloudeu/opencloud-rolling:latest
    restart: unless-stopped
    command: server
    environment:
    - OC_URL=https://${OC_DOMAIN}
    - OC_DOMAIN=${OC_DOMAIN}
    - INITIAL_ADMIN_PASSWORD=${OC_ADMIN_PASSWORD}
    - OC_INSECURE=false
    - PROXY_TLS=false
    - PROXY_HTTP_ADDR=0.0.0.0:9200
    - IDM_CREATE_DEMO_USERS=false
    - OC_JWT_SECRET=${OC_JWT_SECRET}
    - OC_MACHINE_AUTH_API_KEY=${OC_MACHINE_AUTH_API_KEY}
    - OC_TRANSFER_SECRET=${OC_TRANSFER_SECRET}
    - OC_SYSTEM_USER_API_KEY=${OC_SYSTEM_USER_API_KEY}
    - OC_SYSTEM_USER_ID=${OC_SYSTEM_USER_ID}
    - OCIS_JWT_SECRET=${OC_JWT_SECRET}
    - OCIS_MACHINE_AUTH_API_KEY=${OC_MACHINE_AUTH_API_KEY}
    - OCIS_TRANSFER_SECRET=${OC_TRANSFER_SECRET}
    - OCIS_SYSTEM_USER_API_KEY=${OC_SYSTEM_USER_API_KEY}
    - OCIS_SYSTEM_USER_ID=${OC_SYSTEM_USER_ID}
    volumes:
    - opencloud_data:/var/lib/ocis
    networks:
    - default
    - dokploy-network
    labels:
    - traefik.enable=true
    - traefik.docker.network=dokploy-network
    - traefik.http.routers.opencloud.rule=Host(`${OC_DOMAIN}`)
    - traefik.http.routers.opencloud.entrypoints=websecure
    - traefik.http.routers.opencloud.tls=true
    - traefik.http.routers.opencloud.tls.certresolver=letsencrypt
    - traefik.http.services.opencloud.loadbalancer.server.port=9200
  surrealdb:
    image: surrealdb/surrealdb:latest
    restart: unless-stopped
    command: start --user ${SURREAL_DB_USERNAME:-root} --pass ${SURREAL_DB_PASSWORD:-root}
      file://data/surreal.db
    environment:
      SURREAL_USER: ${SURREAL_DB_USERNAME:-root}
      SURREAL_PASS: ${SURREAL_DB_PASSWORD:-root}
    volumes:
    - surreal_data:/data
  golem-server:
    build:
      context: ./devops/golem
    restart: unless-stopped
    networks:
    - default
    - dokploy-network
    labels:
    - traefik.enable=true
    - traefik.docker.network=dokploy-network
    - traefik.http.routers.golem.rule=Host(`${GOLEM_SERVER_NAME}`)
    - traefik.http.routers.golem.entrypoints=websecure
    - traefik.http.routers.golem.tls=true
    - traefik.http.routers.golem.tls.certresolver=letsencrypt
    - traefik.http.services.golem.loadbalancer.server.port=9881
    volumes:
    - golem_data:/data/golem
volumes:
  synapse_data: null
  postgres_data: null
  opencloud_data: null
  golem_data: null
  surreal_data: null
  authentik_database: null
  authentik_redis: null
networks:
  dokploy-network:
    external: true
