version: '3.8'
services:
  synapse-postgresql:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=C --lc-ctype=C
  postgresql-authentik:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
    - authentik_database:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
      POSTGRES_USER: ${PG_USER:-authentik}
      POSTGRES_DB: ${PG_DB:-authentik}
    networks:
    - default
  redis-authentik:
    image: docker.io/library/redis:alpine
    restart: unless-stopped
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli ping | grep PONG
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    volumes:
    - authentik_redis:/data
    networks:
    - default
  authentik-server:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2024.8.2}
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_REDIS__HOST: redis-authentik
      AUTHENTIK_POSTGRESQL__HOST: postgresql-authentik
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
    volumes:
    - ./authentik/media:/media
    - ./authentik/custom-templates:/templates
    depends_on:
      postgresql-authentik:
        condition: service_healthy
      redis-authentik:
        condition: service_healthy
    networks:
    - default
    - dokploy-network
    labels:
    - traefik.enable=true
    - traefik.docker.network=dokploy-network
    - traefik.http.routers.authentik.rule=Host(`${AUTHENTIK_SERVER_NAME}`)
    - traefik.http.routers.authentik.entrypoints=websecure
    - traefik.http.routers.authentik.tls=true
    - traefik.http.routers.authentik.tls.certresolver=letsencrypt
    - traefik.http.services.authentik.loadbalancer.server.port=9000
  authentik-worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2024.8.2}
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_REDIS__HOST: redis-authentik
      AUTHENTIK_POSTGRESQL__HOST: postgresql-authentik
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
    user: root
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ./authentik/media:/media
    - ./authentik/certs:/certs
    - ./authentik/custom-templates:/templates
    depends_on:
      postgresql-authentik:
        condition: service_healthy
      redis-authentik:
        condition: service_healthy
    networks:
    - default
  synapse:
    image: matrixdotorg/synapse:latest
    restart: unless-stopped
    environment:
    - SYNAPSE_SERVER_NAME=${SYNAPSE_SERVER_NAME}
    - SYNAPSE_CONFIG_PATH=/data/homeserver.yaml
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - AUTHENTIK_CLIENT_SECRET=${AUTHENTIK_CLIENT_SECRET}
    - SYNAPSE_MACAROON_SECRET=${SYNAPSE_MACAROON_SECRET}
    - SYNAPSE_FORM_SECRET=${SYNAPSE_FORM_SECRET}
    - SYNAPSE_REGISTRATION_SECRET=${SYNAPSE_REGISTRATION_SECRET}
    - COTURN_SHARED_SECRET=${COTURN_SHARED_SECRET}
  element-web:
    image: vectorim/element-web:latest
    restart: unless-stopped
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    command:
    - -n
    - --log-file=stdout
    - --min-port=49152
    - --max-port=49252
    - --use-auth-secret
    - --static-auth-secret=${COTURN_SHARED_SECRET}
    - --realm=${SYNAPSE_SERVER_NAME}
    - --no-tcp-relay
    environment:
    - COTURN_SHARED_SECRET=${COTURN_SHARED_SECRET}
    - SYNAPSE_SERVER_NAME=${SYNAPSE_SERVER_NAME}
  golem-server:
    build:
      context: ./golem
    restart: unless-stopped
  opencloud:
    image: opencloudeu/opencloud-rolling:latest
    restart: unless-stopped
    command: server
    environment:
    - OC_URL=https://${OC_DOMAIN}
    - OC_DOMAIN=${OC_DOMAIN}
    - INITIAL_ADMIN_PASSWORD=${OC_ADMIN_PASSWORD}
    - OC_INSECURE=false
    - PROXY_TLS=false
    - PROXY_HTTP_ADDR=0.0.0.0:9200
    - IDM_CREATE_DEMO_USERS=false
  surrealdb:
    image: surrealdb/surrealdb:latest
    restart: unless-stopped
    command: start --user ${SURREAL_DB_USERNAME:-root} --pass ${SURREAL_DB_PASSWORD:-root}
      file://data/surreal.db
    environment:
      SURREAL_USER: ${SURREAL_DB_USERNAME:-root}
      SURREAL_PASS: ${SURREAL_DB_PASSWORD:-root}
volumes:
  synapse_data: null
  postgres_data: null
  opencloud_data: null
  golem_data: null
  surreal_data: null
  authentik_database: null
  authentik_redis: null
networks:
  dokploy-network:
    external: true
