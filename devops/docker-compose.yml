version: "3.8"

services:
  synapse-postgresql:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 10s
      timeout: 5s
      retries: 5

  synapse:
    image: matrixdotorg/synapse:latest
    restart: unless-stopped
    environment:
      - SYNAPSE_SERVER_NAME=${SYNAPSE_SERVER_NAME}
      - SYNAPSE_CONFIG_PATH=/data/homeserver.yaml
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - AUTHENTIK_CLIENT_SECRET=${AUTHENTIK_CLIENT_SECRET}
      - SYNAPSE_MACAROON_SECRET=${SYNAPSE_MACAROON_SECRET}
      - SYNAPSE_FORM_SECRET=${SYNAPSE_FORM_SECRET}
      - SYNAPSE_REGISTRATION_SECRET=${SYNAPSE_REGISTRATION_SECRET}
    volumes:
      - synapse_data:/data
      - ./devops/matrix-config/homeserver.yaml:/config/homeserver.yaml:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        # Inject secrets safely using Python
        python -c '
        import os
        c = open("/config/homeserver.yaml").read()
        secrets = ["POSTGRES_PASSWORD", "AUTHENTIK_CLIENT_SECRET", "SYNAPSE_MACAROON_SECRET", "SYNAPSE_FORM_SECRET", "SYNAPSE_REGISTRATION_SECRET"]
        for k in secrets:
            c = c.replace(f"$${{{k}}}", os.environ.get(k, ""))
        open("/data/homeserver.yaml", "w").write(c)
        '
        python -m synapse.app.homeserver --config-path /data/homeserver.yaml --keys-directory /data --generate-keys
        chown -R 991:991 /data
        exec /start.py
    depends_on:
      synapse-postgresql:
        condition: service_healthy
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.synapse.rule=Host(`${SYNAPSE_SERVER_NAME}`)"
      - "traefik.http.routers.synapse.entrypoints=websecure"
      - "traefik.http.routers.synapse.tls=true"
      - "traefik.http.routers.synapse.tls.certresolver=letsencrypt"
      - "traefik.http.services.synapse.loadbalancer.server.port=8008"

  element-web:
    image: vectorim/element-web:latest
    restart: unless-stopped
    volumes:
      # Crucial: Must be read-only so the entrypoint cannot destroy our custom theme!
      - ./devops/element/config.json:/app/config.json:ro
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.element.rule=Host(`chat.johnethel.school`)"
      - "traefik.http.routers.element.entrypoints=websecure"
      - "traefik.http.routers.element.tls=true"
      - "traefik.http.routers.element.tls.certresolver=letsencrypt"
      - "traefik.http.services.element.loadbalancer.server.port=80"

volumes:
  synapse_data:
  postgres_data:

networks:
  dokploy-network:
    external: true
