    function toggleGeneralQuestionKind(row) {
        const typeEl = row.querySelector("[data-ga-type]");
        if (!typeEl) return;
        const isMcq = typeEl.value === "mcq";
        const mcq = row.querySelector("[data-ga-mcq]");
        const essay = row.querySelector("[data-ga-essay]");
        if (mcq) mcq.classList.toggle("hidden", !isMcq);
        if (essay) essay.classList.toggle("hidden", isMcq);
        const marks = row.querySelector("[data-ga-marks]");
        // New rows start at the defaults the lesson bank uses: 1 for an MCQ, 5 for theory.
        if (marks && (marks.value === "" || marks.value === "1" || marks.value === "5")) marks.value = isMcq ? "1" : "5";
    }

    // What the teacher built, in the strict stored shape (type/question/options/answer/marks).
    function collectGeneralQuestions() {
        const area = document.getElementById("ga-questions-area");
        if (!area) return [];
        return Array.from(area.querySelectorAll("[data-ga-question-row]")).map(row => {
            const type = ((row.querySelector("[data-ga-type]") || {}).value) || "mcq";
            const question = ((row.querySelector("[data-ga-question]") || {}).value || "").trim();
            const marksEl = row.querySelector("[data-ga-marks]");
            const marks = Math.max(0, parseInt(marksEl && marksEl.value, 10) || 0);
            if (type === "mcq") {
                const options = [0, 1, 2].map(i => {
                    const el = row.querySelector(`[data-ga-option="${i}"]`);
                    return el ? el.value.trim() : "";
                }).filter(o => o !== "");
                const answer = ((row.querySelector("[data-ga-answer]") || {}).value) || "a";
                return { type: "mcq", question, ...(options.length ? { options } : {}), answer, marks };
            }
            const modelEl = row.querySelector("[data-ga-model]");
            return { type: "essay", question, answer: modelEl ? modelEl.value.trim() : "", marks };
        }).filter(q => q.question !== "");
    }

    function updateGeneralQuestionTotals() {
        const questions = collectGeneralQuestions();
        const count = document.getElementById("ga-question-count");
        const total = document.getElementById("ga-total-marks");
        if (count) count.textContent = String(questions.length);
        if (total) total.textContent = String(questions.reduce((sum, q) => sum + (q.marks || 0), 0));
    }

    // datetime-local gives local wall-clock time with no zone; send UTC so the stored instant is
    // unambiguous. A blank field means "no rule".
    function localDateTimeToUtc(v) {
        if (!v) return "";
        const d = new Date(v);
        return isNaN(d.getTime()) ? "" : d.toISOString();
    }

    function openCreateGeneralModal() {
        const modal = document.getElementById("create-general-assessment-modal");
        const subjectEl = document.getElementById("ga-subject-select");
        const sessionEl = document.getElementById("ga-session-term-select");
        const context = document.getElementById("ga-modal-context");
        if (context) {
            const subjectName = subjectEl && subjectEl.selectedOptions && subjectEl.selectedOptions[0] ? subjectEl.selectedOptions[0].textContent : "";
            const sessionName = sessionEl && sessionEl.selectedOptions && sessionEl.selectedOptions[0] ? sessionEl.selectedOptions[0].textContent : "";
            context.textContent = (subjectName && sessionName) ? `For ${subjectName} · ${sessionName}` : "Pick a subject and session term above.";
        }
        const area = document.getElementById("ga-questions-area");
        if (area && !area.querySelector("[data-ga-question-row]")) addGeneralQuestionRow();
        modal && modal.classList.remove("hidden");
    }

    async function createGeneralAssessment() {
        const subjectEl = document.getElementById("ga-subject-select");
        const sessionEl = document.getElementById("ga-session-term-select");
        const subjectId = subjectEl ? subjectEl.value : "";
        const sessionTermId = sessionEl ? sessionEl.value : "";
        if (!subjectId || !sessionTermId) { alert("Choose a subject and a session term first."); return; }
        const titleInput = document.getElementById("ga-title-input");
        const title = titleInput ? titleInput.value.trim() : "";
        if (!title) { alert("Please enter a title."); return; }
        const weightEl = document.getElementById("ga-weight-input");
        const weightRaw = weightEl ? weightEl.value : "";
        if (weightRaw === "") { alert("Please enter the percentage weight for the term result."); return; }
        // The column is an int and the backend reads whole numbers, so refuse a fraction here rather
        // than storing a rounded number the teacher did not type.
        const weight = Number(weightRaw);
        if (!Number.isFinite(weight) || weight < 0 || Math.round(weight) !== weight) {
            alert("The percentage weight must be a whole number.");
            return;
        }
        const questions = collectGeneralQuestions();
        const totalMark = questions.reduce((sum, q) => sum + (q.marks || 0), 0);
        const value = (id) => { const el = document.getElementById(id); return el ? el.value : ""; };
        const deadline = localDateTimeToUtc(value("ga-deadline-input"));
        const scheduledAt = localDateTimeToUtc(value("ga-scheduled-input"));
        const maxResubmissions = value("ga-resubmissions-input");
        try {
            const res = await fetch("/api/teacher/create-general-assessment", {
                method: "POST",
                headers: { "Authorization": "Bearer " + (localStorage.getItem("auth_token") || ""), "Content-Type": "application/json" },
                body: JSON.stringify({
                    subject_id: subjectId, session_term_id: sessionTermId, title,
                    description: value("ga-description-input"),
                    percentage_weight: weight, questions, total_mark: totalMark,
                    ...(deadline ? { deadline } : {}),
                    ...(scheduledAt ? { scheduled_at: scheduledAt } : {}),
                    ...(maxResubmissions ? { max_resubmissions: Number(maxResubmissions) } : {}),
                })
            });
            const data = await res.json().catch(() => null);
            // A failed write carries the database's own message in `detail` (see db_response!).
            const failure = data && (Array.isArray(data)
                ? (data[0] && (data[0].error || data[0].detail))
                : (data.error ? (data.detail ? `${data.error}: ${data.detail}` : data.error) : null));
            if (!res.ok || failure) { alert(failure || "Failed to create the assessment."); return; }
            const modal = document.getElementById("create-general-assessment-modal");
            modal && modal.classList.add("hidden");
            if (titleInput) titleInput.value = "";
            ["ga-description-input", "ga-weight-input", "ga-deadline-input", "ga-scheduled-input", "ga-resubmissions-input"]
                .forEach(id => { const el = document.getElementById(id); if (el) el.value = ""; });
            const area = document.getElementById("ga-questions-area");
            if (area) area.innerHTML = "";
            updateGeneralQuestionTotals();
            loadTeacherGeneralAssessments();
        } catch(e) { alert("Failed to create the assessment."); }
    }

    // Jump to the grading tab filtered to one general assessment.
    window.viewGeneralSubmissions = (assessmentId) => {
        _gradingAssessmentId = assessmentId;
        const tab = document.getElementById("tab-general-grading");
        if (tab) { tab.click(); } else { loadSubmissions(); }

    function showGeneralTab(which) {
        const activeTabCls = "px-4 py-2 text-sm border-b-2 border-primary text-primary font-medium transition cursor-pointer";
        const inactiveTabCls = "px-4 py-2 text-sm border-b-2 border-transparent text-muted-foreground hover:text-foreground transition cursor-pointer";
        const tabs = {
            general: document.getElementById("tab-general-assessments"),
            grading: document.getElementById("tab-general-grading"),
            lesson: document.getElementById("tab-lesson-assessments"),
        };
        const panels = {
            general: document.getElementById("general-assessments-panel"),
            grading: document.getElementById("general-grading-panel"),
            lesson: document.getElementById("assessments-panel"),
        };
        Object.entries(tabs).forEach(([name, el]) => {
            if (!el) return;
            el.className = name === which ? activeTabCls : inactiveTabCls;
        });
        Object.entries(panels).forEach(([name, el]) => {
            if (!el) return;
            el.classList.toggle("hidden", name !== which);
        });
        if (which === "general") { loadGeneralAssessmentsForRole(); }
        if (which === "grading") { loadSubmissions(); }
        if (which === "lesson") { loadAssessments(false); }
    }

    function loadGeneralAssessmentsForRole() {
        if (_assessmentHubRole === "teacher") { loadTeacherGeneralAssessments(); } else { loadStudentGeneralAssessments(); }
    }

    // The teacher's hub fetches its pickers first: the lists are scoped to one subject and one
    // session term.
    async function loadGeneralAssessmentPickers() {
        const auth = { "Authorization": "Bearer " + (localStorage.getItem("auth_token") || "") };
        const fill = (selectId, rows, label) => {
            const select = document.getElementById(selectId);
            if (!select) return;
            select.innerHTML = rows.map(r => `<option value="${escHtml(r.id || "")}">${escHtml(label(r))}</option>`).join("");
        };
        // A select cannot show a skeleton, so a failed fetch leaves it naming what it could not load;
        // the list below carries the same error with its retry.
        const fillBroken = (selectId, label) => {
            const select = document.getElementById(selectId);
            if (!select) return;
            select.innerHTML = `<option value="">${escHtml(label)}</option>`;
        };
        try {
            const subjectRes = await fetch("/api/subjects", { headers: auth });
            if (!subjectRes.ok) throw new Error(await failureMessage(subjectRes));
            fill("ga-subject-select", unwrapRows(await subjectRes.json()), s => s.name || s.code || "Subject");
            const sessionRes = await fetch("/api/session_terms", { headers: auth });
            if (!sessionRes.ok) throw new Error(await failureMessage(sessionRes));
            const sessions = unwrapRows(await sessionRes.json());
            // Prefer an active term, otherwise the first one.
            const active = sessions.filter(s => s.active === true);
            const ordered = active.length ? [...active, ...sessions.filter(s => s.active !== true)] : sessions;
            fill("ga-session-term-select", ordered, s => s.session_name || "Session term");
        } catch(e) {
            console.error("Failed to load the assessment pickers:", e);
            fillBroken("ga-subject-select", "Could not load subjects");
            fillBroken("ga-session-term-select", "Could not load session terms");
        }
        loadTeacherGeneralAssessments();
    }

    // The retry control a failed general-assessment list draws: the pickers are refetched too, so a
    // retry after a picker failure fills them in as well.
    window.retryGeneralAssessments = () => {
        if (_assessmentHubRole === "teacher") { loadGeneralAssessmentPickers(); } else { loadStudentGeneralAssessments(); }
    };

    // --- Hub wiring: one document-level listener per page visit, torn down on navigation ---

    let _assessmentHubClick = null;
    let _assessmentHubInput = null;

    function teardownAssessmentHub() {
        if (_assessmentHubClick) { document.removeEventListener("click", _assessmentHubClick); _assessmentHubClick = null; }
        if (_assessmentHubInput) {
            document.removeEventListener("input", _assessmentHubInput);
            document.removeEventListener("change", _assessmentHubInput);
            _assessmentHubInput = null;
        }
    }

    function setupAssessmentHub(isTeacher) {
        teardownAssessmentHub();
        _assessmentHubRole = isTeacher ? "teacher" : "student";

        // The app re-renders its DOM on state changes, so every control is handled by one
        // document-level listener rather than by listeners attached to the nodes.
        _assessmentHubClick = (event) => {
            const hit = (selector) => event.target.closest && event.target.closest(selector);
            const modal = document.getElementById("create-general-assessment-modal");
            if (hit("#tab-general-assessments")) { showGeneralTab("general"); return; }
            if (hit("#tab-general-grading")) { showGeneralTab("grading"); return; }
            if (hit("#tab-lesson-assessments")) { showGeneralTab("lesson"); return; }
            if (hit("#create-general-assessment-btn")) { openCreateGeneralModal(); return; }
            if (hit("#close-create-general-modal") || hit("#cancel-create-general-modal")) { modal && modal.classList.add("hidden"); return; }
            if (hit("#ga-add-question")) { addGeneralQuestionRow(); return; }
            if (hit("[data-ga-remove]")) {
                const row = hit("[data-ga-remove]").closest("[data-ga-question-row]");
                if (row) { row.remove(); updateGeneralQuestionTotals(); }
                return;
            }
            if (hit("#ga-submit-create")) { createGeneralAssessment(); return; }
            // The shared answer form: the lesson viewer binds the same ids on its own page.
            if (hit("#submit-assessment-answers")) { if (_openAssessmentId) submitAssessmentAnswers(_openAssessmentId); return; }
            if (hit("#back-to-assessments")) {
                _openAssessmentId = null;
                if (_openAssessmentType === "general") { loadStudentGeneralAssessments(); } else { loadAssessments(false); }
                return;
            }
        };
        document.addEventListener("click", _assessmentHubClick);

        _assessmentHubInput = (event) => {
            if (!event.target.closest || !event.target.closest("[data-ga-question-row]")) return;
            if (event.target.matches("[data-ga-type]")) {
                toggleGeneralQuestionKind(event.target.closest("[data-ga-question-row]"));
            }
            if (event.target.matches("[data-ga-marks], [data-ga-option], [data-ga-question]")) {
                updateGeneralQuestionTotals();
            }
        };
        document.addEventListener("input", _assessmentHubInput);
        document.addEventListener("change", _assessmentHubInput);

        if (isTeacher) {
            loadGeneralAssessmentPickers();
        } else {
            loadStudentGeneralAssessments();
        }
    }

    // ========================================================
    // MATRIX / SYNAPSE MESSAGING
    // ========================================================

    let _matrixClient = { token: null, homeserver: null, userId: null, nextBatch: null };

    async function setupMessaging() {
        if (_matrixSyncInterval) { clearInterval(_matrixSyncInterval); _matrixSyncInterval = null; }

        // Fetch Matrix token from backend proxy
        try {
            const res = await fetch("/api/matrix/token", {
                headers: { "Authorization": "Bearer " + (localStorage.getItem("auth_token") || "") }
            });
            const { token, homeserver } = await res.json();
            _matrixClient.token = token;
            _matrixClient.homeserver = homeserver || "https://matrix.johnethel.school";

            if (!token) {
                showMatrixError("Matrix authentication not configured. Contact your administrator.");
                return;
            }

            // Start sync
            await matrixSync();
            _matrixSyncInterval = setInterval(matrixSync, 5000);

            // Setup send button
            const sendBtn = document.getElementById("matrix-send-btn");
            const inputEl = document.getElementById("matrix-input");
            sendBtn && sendBtn.addEventListener("click", () => sendMatrixMessage());
            inputEl && inputEl.addEventListener("keydown", (e) => {
                if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMatrixMessage(); }
            });
        } catch(e) {
            showMatrixError("Failed to connect to messaging server.");
            console.error("Matrix setup error:", e);
        }
    }

    function showMatrixError(msg) {
        const roomsList = document.getElementById("matrix-rooms-list");
        if (roomsList) roomsList.innerHTML = `<p class="text-xs text-red-500">${escHtml(msg)}</p>`;
    }

    async function matrixSync() {
        if (!_matrixClient.token) return;
        try {
            const params = _matrixClient.nextBatch ? `?since=${_matrixClient.nextBatch}&timeout=0` : "?timeout=0";
            const res = await fetch(`${_matrixClient.homeserver}/_matrix/client/v3/sync${params}`, {
                headers: { "Authorization": "Bearer " + _matrixClient.token }
            });
            if (!res.ok) return;
            const sync = await res.json();
            _matrixClient.nextBatch = sync.next_batch;

            // Update rooms list
            const rooms = sync.rooms?.join || {};
            const roomsList = document.getElementById("matrix-rooms-list");
            if (roomsList && Object.keys(rooms).length) {
                roomsList.innerHTML = Object.entries(rooms).map(([roomId, room]) => {
                    const nameEvent = room.state?.events?.find(e => e.type === "m.room.name");
                    const name = nameEvent?.content?.name || roomId.split(":")[0].replace("!", "").slice(0, 20);
                    const unread = room.unread_notifications?.notification_count || 0;
                    return `<button onclick="selectRoom('${escHtml(roomId)}', '${escHtml(name)}')"
                        class="w-full text-left px-3 py-2 rounded-md text-sm hover:bg-muted transition-colors flex items-center justify-between group cursor-pointer">
                        <span class="truncate font-medium"># ${escHtml(name)}</span>
                        ${unread ? `<span class="text-xs bg-primary text-primary-foreground rounded-full px-1.5 min-w-5 text-center">${unread}</span>` : ""}
                    </button>`;
                }).join("");
            } else if (roomsList && !roomsList.children.length) {
                roomsList.innerHTML = `<p class="text-xs text-muted-foreground italic">No channels available.</p>`;
            }

            // If a room is selected, update its messages
            if (_currentMatrixRoom && rooms[_currentMatrixRoom]) {
                const timeline = rooms[_currentMatrixRoom].timeline?.events || [];
                if (timeline.length) appendMatrixMessages(timeline);
            }
        } catch(e) { /* silent — will retry */ }
    }

    window.selectRoom = async (roomId, name) => {
        _currentMatrixRoom = roomId;
        const nameEl = document.getElementById("matrix-room-name");
        const messagesEl = document.getElementById("matrix-messages");
        if (nameEl) nameEl.textContent = "# " + name;
        if (messagesEl) messagesEl.innerHTML = '<div class="text-center text-muted-foreground text-sm py-4">Loading messages...</div>';

        // Load recent messages
        try {
            const res = await fetch(`${_matrixClient.homeserver}/_matrix/client/v3/rooms/${encodeURIComponent(roomId)}/messages?dir=b&limit=50`, {
                headers: { "Authorization": "Bearer " + _matrixClient.token }
            });
            const data = await res.json();
            const events = (data.chunk || []).filter(e => e.type === "m.room.message").reverse();
            if (messagesEl) {
                messagesEl.innerHTML = events.length ? "" : '<div class="text-center text-muted-foreground text-sm py-4 italic">No messages yet.</div>';
                appendMatrixMessages(events, true);
            }
        } catch(e) { console.error("Failed to load messages:", e); }
    };

    function appendMatrixMessages(events, replace = false) {
        const messagesEl = document.getElementById("matrix-messages");
        if (!messagesEl) return;
        const filtered = events.filter(e => e.type === "m.room.message");
        if (!filtered.length) return;
        if (replace) messagesEl.innerHTML = "";
        filtered.forEach(event => {
            const div = document.createElement("div");
            div.className = "flex flex-col gap-0.5";
            const sender = event.sender?.split(":")[0]?.replace("@", "") || "Unknown";
            const body = event.content?.body || "";
            const time = event.origin_server_ts ? new Date(event.origin_server_ts).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) : "";
            div.innerHTML = `
                <div class="flex items-baseline gap-2">
                    <span class="text-xs font-semibold text-primary">${escHtml(sender)}</span>
                    <span class="text-xs text-muted-foreground">${time}</span>
                </div>
                <p class="text-sm leading-relaxed">${escHtml(body)}</p>`;
            messagesEl.appendChild(div);
        });
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function sendMatrixMessage() {
        const input = document.getElementById("matrix-input");
        if (!input || !_currentMatrixRoom || !_matrixClient.token) return;
        const body = input.value.trim();
        if (!body) return;
        input.value = "";
        try {
            const txnId = Date.now();
            await fetch(`${_matrixClient.homeserver}/_matrix/client/v3/rooms/${encodeURIComponent(_currentMatrixRoom)}/send/m.room.message/${txnId}`, {
                method: "PUT",
                headers: { "Authorization": "Bearer " + _matrixClient.token, "Content-Type": "application/json" },
                body: JSON.stringify({ msgtype: "m.text", body })
            });
        } catch(e) { console.error("Send failed:", e); input.value = body; }
    }

    // Prod objectives are objects ({ objective, taxonomy_level }); older rows are plain strings.
    function objectiveText(obj) {
        if (typeof obj === "string") return obj;
        return obj.objective || obj.text || JSON.stringify(obj);
    }

    function escHtml(str) {
        return String(str || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }
</script>
</body>
</html>
