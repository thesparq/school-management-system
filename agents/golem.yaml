manifestVersion: 1.5.0
app: agents
environments:
  local:
    server: local
    componentPresets: debug
  cloud:
    server:
      url: https://golem.johnethel.school
      auth:
        staticToken: '{{ GOLEM_AUTH_KEY }}'
    componentPresets: release
componentTemplates:
  my-moonbit:
    presets:
      debug:
        default: true
        build:
        - command: ./.mooncakes/golemcloud/golem_sdk_tools/golem-sdk-tools reexports
            .mooncakes/golemcloud/golem_sdk {{ componentDir }}
          dir: '{{ appRootDir }}'
        - command: ./.mooncakes/golemcloud/golem_sdk_tools/golem-sdk-tools agents
            {{ appRootDir }}
          dir: '{{ appRootDir }}'
        - command: moon build --target wasm
          dir: '{{ appRootDir }}'
        - command: wasm-tools component embed .mooncakes/golemcloud/golem_sdk/wit
            {{ appRootDir }}/_build/wasm/debug/build/{{ moonbitBuildPackagePath }}
            --encoding utf16 --output {{ appRootDir }}/_build/wasm/debug/{{ componentName
            | to_snake_case }}.embed.wasm
          dir: '{{ appRootDir }}'
          mkdirs:
          - '{{ appRootDir }}/_build/wasm/debug'
        - command: wasm-tools component new {{ appRootDir }}/_build/wasm/debug/{{
            componentName | to_snake_case }}.embed.wasm --output {{ appRootDir }}/_build/wasm/debug/{{
            componentName | to_snake_case }}.agent.wasm
        componentWasm: '{{ appRootDir }}/_build/wasm/debug/{{ componentName | to_snake_case
          }}.agent.wasm'
      release:
        build:
        - command: ./.mooncakes/golemcloud/golem_sdk_tools/golem-sdk-tools reexports
            .mooncakes/golemcloud/golem_sdk {{ componentDir }}
          dir: '{{ appRootDir }}'
        - command: ./.mooncakes/golemcloud/golem_sdk_tools/golem-sdk-tools agents
            {{ appRootDir }}
          dir: '{{ appRootDir }}'
        - command: moon build --target wasm --release
          dir: '{{ appRootDir }}'
        - command: wasm-tools component embed .mooncakes/golemcloud/golem_sdk/wit
            {{ appRootDir }}/_build/wasm/release/build/{{ moonbitBuildPackagePath
            }} --encoding utf16 --output {{ appRootDir }}/_build/wasm/release/{{ componentName
            | to_snake_case }}.embed.wasm
          dir: '{{ appRootDir }}'
          mkdirs:
          - '{{ appRootDir }}/_build/wasm/release'
        - command: wasm-tools component new {{ appRootDir }}/_build/wasm/release/{{
            componentName | to_snake_case }}.embed.wasm --output {{ appRootDir }}/_build/wasm/release/{{
            componentName | to_snake_case }}.agent.wasm
        componentWasm: '{{ appRootDir }}/_build/wasm/release/{{ componentName | to_snake_case
          }}.agent.wasm'
components:
  app:agents:
    dir: app-agents
    templates: my-moonbit
httpApi:
  deployments:
    local:
    - domain: agents.localhost:9006
      agents:
        CoreApi: {}
        AssessmentSession: {}
        AdminAgent: {}
        StudentAgent: {}
        TeacherAgent: {}
        ParentAgent: {}
