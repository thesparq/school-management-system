name: Deploy Golem Backend

on:
  push:
    branches:
      - main
    paths:
      - 'agents/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash

      - name: Install Wasm-Tools
        run: |
          curl -L "https://github.com/bytecodealliance/wasm-tools/releases/download/wasm-tools-1.218.0/wasm-tools-1.218.0-x86_64-linux.tar.gz" | tar -xz
          sudo mv wasm-tools-1.218.0-x86_64-linux/wasm-tools /usr/local/bin/

      - name: Install Golem CLI
        run: |
          curl -L "https://github.com/golemcloud/golem/releases/latest/download/golem-cli-linux-amd64.tar.gz" | tar -xz
          sudo mv golem-cli /usr/local/bin/

      - name: Build & Deploy
        env:
          GOLEM_ROUTER_URL: ${{ secrets.GOLEM_SERVER_URL }}
        run: |
          export PATH="$HOME/.moon/bin:$PATH"
          cd agents
          moon build --target wasm --release
          golem profile add prod --url ${{ secrets.GOLEM_SERVER_URL }} --set-active
          golem deploy
